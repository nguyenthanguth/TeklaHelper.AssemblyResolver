name: Release

# Publishes the package to NuGet when a GitHub Release is published.
# The package version is taken from the release tag, e.g. v1.2.0 -> 1.2.0, v1.3.0-beta.1 -> 1.3.0-beta.1.
on:
  release:
    types: [published]

permissions:
  contents: write # upload the packages to the GitHub Release
  id-token: write # NuGet Trusted Publishing: exchange the GitHub OIDC token for a short-lived NuGet API key

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Passed through env instead of an expression inside scripts, so a crafted tag name cannot inject shell commands
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Get version from tag
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag is not a valid version. Use the format v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: dotnet build TeklaHelper.AssemblyResolver.slnx -c Release "-p:Version=$PACKAGE_VERSION"

      - name: Pack
        shell: bash
        run: dotnet pack TeklaHelper.AssemblyResolver.csproj -c Release --no-build -o artifacts "-p:Version=$PACKAGE_VERSION"

      # Trusted Publishing: no stored secret, the key is issued per run and expires after about an hour.
      # Requires a matching policy on nuget.org (Account > Trusted Publishing) for this repo and release.yml.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: nguyenthanguth # nuget.org profile name (not the email)

      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # Pushing the .nupkg also pushes the matching .snupkg symbols package
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload packages to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" artifacts/* --clobber
