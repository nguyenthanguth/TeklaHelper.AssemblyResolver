name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # Windows runner: the library reads the Windows Registry and the test app targets .NET Framework 4.8
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TeklaHelper.AssemblyResolver.slnx

      - name: Build
        run: dotnet build TeklaHelper.AssemblyResolver.slnx -c Release --no-restore

      - name: Pack
        run: dotnet pack TeklaHelper.AssemblyResolver/TeklaHelper.AssemblyResolver.csproj -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: nuget-package
          path: artifacts/*
          if-no-files-found: error
